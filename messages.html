<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - SYMBIOSIS.AI</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Main Styles -->
    <link rel="stylesheet" href="assets/css/styles.css">
    
    <style>
        .messages-container {
            display: flex;
            height: 100vh;
        }
        
        /* Conversations Sidebar */
        .conversations-sidebar {
            width: 350px;
            background: white;
            border-right: 1px solid #e1e8ed;
            display: flex;
            flex-direction: column;
        }
        
        .conversations-header {
            padding: 20px;
            border-bottom: 1px solid #e1e8ed;
        }
        
        .conversations-search {
            position: relative;
            margin-top: 15px;
        }
        
        .conversations-search input {
            width: 100%;
            padding: 10px 15px 10px 40px;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            font-size: 14px;
        }
        
        .conversations-search i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #666;
        }
        
        .conversations-list {
            flex: 1;
            overflow-y: auto;
        }
        
        .conversation-item {
            display: flex;
            padding: 15px;
            border-bottom: 1px solid #e1e8ed;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .conversation-item:hover {
            background: #f8f9fa;
        }
        
        .conversation-item.active {
            background: #e8f3ee;
            border-left: 4px solid #2d5f3f;
        }
        
        .conversation-avatar {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, #2d5f3f, #1e5a8e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
            margin-right: 15px;
        }
        
        .conversation-info {
            flex: 1;
            min-width: 0;
        }
        
        .conversation-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 5px;
        }
        
        .conversation-name {
            font-weight: 600;
            color: #2c3e50;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .conversation-time {
            font-size: 12px;
            color: #999;
        }
        
        .conversation-preview {
            color: #666;
            font-size: 14px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .conversation-badge {
            background: #e74c3c;
            color: white;
            font-size: 12px;
            padding: 2px 8px;
            border-radius: 10px;
            margin-left: auto;
        }
        
        /* Chat Area */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: #f8f9fa;
        }
        
        .chat-header {
            background: white;
            padding: 20px;
            border-bottom: 1px solid #e1e8ed;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        
        .chat-user {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .chat-user-avatar {
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #2d5f3f, #1e5a8e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 600;
        }
        
        .chat-user-info h4 {
            margin: 0;
            color: #2c3e50;
        }
        
        .chat-user-info p {
            margin: 5px 0 0;
            color: #666;
            font-size: 14px;
        }
        
        .chat-actions {
            display: flex;
            gap: 10px;
        }
        
        .chat-action-btn {
            width: 40px;
            height: 40px;
            background: white;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .chat-action-btn:hover {
            background: #2d5f3f;
            color: white;
            border-color: #2d5f3f;
        }
        
        /* Messages Container */
        .messages-container-inner {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .message-date {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }
        
        .date-label {
            background: #e1e8ed;
            color: #666;
            padding: 6px 15px;
            border-radius: 20px;
            font-size: 12px;
            display: inline-block;
        }
        
        .message {
            max-width: 70%;
            display: flex;
            gap: 10px;
        }
        
        .message.incoming {
            align-self: flex-start;
        }
        
        .message.outgoing {
            align-self: flex-end;
            flex-direction: row-reverse;
        }
        
        .message-avatar {
            width: 35px;
            height: 35px;
            background: linear-gradient(135deg, #2d5f3f, #1e5a8e);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: 600;
            flex-shrink: 0;
        }
        
        .message-content {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .message-bubble {
            padding: 12px 16px;
            border-radius: 18px;
            position: relative;
            word-wrap: break-word;
        }
        
        .incoming .message-bubble {
            background: white;
            border: 1px solid #e1e8ed;
            border-bottom-left-radius: 4px;
        }
        
        .outgoing .message-bubble {
            background: linear-gradient(135deg, #2d5f3f, #1e5a8e);
            color: white;
            border-bottom-right-radius: 4px;
        }
        
        .message-time {
            font-size: 11px;
            color: #999;
        }
        
        .outgoing .message-time {
            text-align: right;
            color: rgba(255,255,255,0.8);
        }
        
        /* Message Input */
        .message-input-container {
            background: white;
            padding: 20px;
            border-top: 1px solid #e1e8ed;
        }
        
        .message-input-wrapper {
            display: flex;
            gap: 10px;
            align-items: flex-end;
        }
        
        .message-attachments {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        
        .attachment-btn {
            width: 40px;
            height: 40px;
            background: #f8f9fa;
            border: 2px solid #e1e8ed;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .attachment-btn:hover {
            background: #2d5f3f;
            color: white;
            border-color: #2d5f3f;
        }
        
        .message-input {
            flex: 1;
            position: relative;
        }
        
        .message-input textarea {
            width: 100%;
            padding: 12px 50px 12px 15px;
            border: 2px solid #e1e8ed;
            border-radius: 12px;
            font-size: 14px;
            resize: none;
            min-height: 50px;
            max-height: 150px;
        }
        
        .message-input textarea:focus {
            outline: none;
            border-color: #2d5f3f;
        }
        
        .send-btn {
            position: absolute;
            right: 10px;
            bottom: 10px;
            width: 35px;
            height: 35px;
            background: #2d5f3f;
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .send-btn:hover {
            background: #4a9d5f;
            transform: scale(1.1);
        }
        
        .send-btn:disabled {
            background: #e1e8ed;
            cursor: not-allowed;
        }
        
        /* Empty State */
        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }
        
        .empty-icon {
            font-size: 64px;
            color: #e1e8ed;
            margin-bottom: 20px;
        }
        
        /* Deal Info */
        .deal-info {
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
        }
        
        .deal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }
        
        .deal-status {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .status-negotiation {
            background: #fff3cd;
            color: #856404;
        }
        
        .status-confirmed {
            background: #d4edda;
            color: #155724;
        }
        
        .deal-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .detail-item {
            padding: 10px;
            background: #f8f9fa;
            border-radius: 8px;
        }
        
        .detail-label {
            font-size: 12px;
            color: #666;
            margin-bottom: 5px;
        }
        
        .detail-value {
            font-weight: 600;
            color: #2c3e50;
        }
        
        @media (max-width: 768px) {
            .messages-container {
                flex-direction: column;
            }
            
            .conversations-sidebar {
                width: 100%;
                height: 300px;
            }
            
            .chat-area {
                height: calc(100vh - 300px);
            }
        }
    </style>
</head>
<body>
    <div class="messages-container">
        <!-- Conversations Sidebar -->
        <div class="conversations-sidebar">
            <div class="conversations-header">
                <h3 class="mb-0">Messages</h3>
                <div class="conversations-search">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchConversations" placeholder="Search conversations...">
                </div>
            </div>
            
            <div class="conversations-list" id="conversationsList">
                <!-- Conversations will be loaded here -->
            </div>
        </div>
        
        <!-- Chat Area -->
        <div class="chat-area" id="chatArea">
            <!-- Empty State -->
            <div class="empty-chat" id="emptyChat">
                <div class="empty-icon">
                    <i class="fas fa-comments"></i>
                </div>
                <h4>No conversation selected</h4>
                <p class="text-muted">Select a conversation from the list or start a new one</p>
                <button class="btn btn-primary mt-3" onclick="startNewConversation()">
                    <i class="fas fa-plus"></i> Start New Chat
                </button>
            </div>
            
            <!-- Active Chat -->
            <div id="activeChat" style="display: none;">
                <!-- Chat Header -->
                <div class="chat-header">
                    <div class="chat-user">
                        <div class="chat-user-avatar" id="chatUserAvatar">CO</div>
                        <div class="chat-user-info">
                            <h4 id="chatUserName">Company Name</h4>
                            <p id="chatUserStatus">Online</p>
                        </div>
                    </div>
                    
                    <div class="chat-actions">
                        <button class="chat-action-btn" title="View Company Profile">
                            <i class="fas fa-building"></i>
                        </button>
                        <button class="chat-action-btn" title="Voice Call">
                            <i class="fas fa-phone"></i>
                        </button>
                        <button class="chat-action-btn" title="Video Call">
                            <i class="fas fa-video"></i>
                        </button>
                        <button class="chat-action-btn" title="More Options">
                            <i class="fas fa-ellipsis-v"></i>
                        </button>
                    </div>
                </div>
                
                <!-- Deal Information -->
                <div class="deal-info" id="dealInfo" style="display: none;">
                    <div class="deal-header">
                        <h5 class="mb-0">Active Deal</h5>
                        <span class="deal-status status-negotiation" id="dealStatus">Negotiation</span>
                    </div>
                    
                    <div class="deal-details" id="dealDetails">
                        <!-- Deal details will be loaded here -->
                    </div>
                    
                    <div class="text-end">
                        <button class="btn btn-sm btn-primary" onclick="viewDealDetails()">
                            <i class="fas fa-external-link-alt"></i> View Deal
                        </button>
                    </div>
                </div>
                
                <!-- Messages Container -->
                <div class="messages-container-inner" id="messagesContainer">
                    <!-- Messages will be loaded here -->
                </div>
                
                <!-- Message Input -->
                <div class="message-input-container">
                    <div class="message-attachments">
                        <button class="attachment-btn" title="Attach File">
                            <i class="fas fa-paperclip"></i>
                        </button>
                        <button class="attachment-btn" title="Attach Image">
                            <i class="fas fa-image"></i>
                        </button>
                        <button class="attachment-btn" title="Attach Document">
                            <i class="fas fa-file"></i>
                        </button>
                        <button class="attachment-btn" title="Send Location">
                            <i class="fas fa-map-marker-alt"></i>
                        </button>
                    </div>
                    
                    <div class="message-input-wrapper">
                        <div class="message-input">
                            <textarea id="messageInput" placeholder="Type your message..." rows="1"></textarea>
                            <button class="send-btn" id="sendMessageBtn">
                                <i class="fas fa-paper-plane"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    
    <!-- Scripts -->
    <script src="assets/js/firebase-config.js"></script>
    <script src="assets/js/app.js"></script>
    
    <script>
        let currentConversation = null;
        let conversations = [];
        let messages = [];
        let messageListener = null;
        
        document.addEventListener('DOMContentLoaded', function() {
            // Check authentication
            const user = JSON.parse(localStorage.getItem('symbiosis_user'));
            if (!user) {
                window.location.href = 'login.html';
                return;
            }
            
            // Initialize
            loadConversations();
            
            // Check URL for conversation ID
            const urlParams = new URLSearchParams(window.location.search);
            const conversationId = urlParams.get('conversation');
            
            if (conversationId) {
                openConversation(conversationId);
            }
            
            // Setup event listeners
            document.getElementById('messageInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            
            document.getElementById('sendMessageBtn').addEventListener('click', sendMessage);
            
            document.getElementById('searchConversations').addEventListener('input', searchConversations);
            
            // Auto-resize textarea
            const textarea = document.getElementById('messageInput');
            textarea.addEventListener('input', function() {
                this.style.height = 'auto';
                this.style.height = (this.scrollHeight) + 'px';
            });
        });
        
        async function loadConversations() {
            const user = JSON.parse(localStorage.getItem('symbiosis_user'));
            if (!user || !user.companyId) return;
            
            try {
                const db = firebase.database();
                const snapshot = await db.ref('conversations')
                    .orderByChild('participants/' + user.companyId)
                    .equalTo(true)
                    .once('value');
                
                if (!snapshot.exists()) {
                    showEmptyConversations();
                    return;
                }
                
                const conversationsData = snapshot.val();
                conversations = Object.entries(conversationsData).map(([id, data]) => ({
                    id,
                    ...data
                }));
                
                // Sort by last message time
                conversations.sort((a, b) => {
                    const timeA = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
                    const timeB = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
                    return timeB - timeA;
                });
                
                renderConversations();
                
            } catch (error) {
                console.error('Error loading conversations:', error);
                showEmptyConversations();
            }
        }
        
        function showEmptyConversations() {
            const container = document.getElementById('conversationsList');
            container.innerHTML = `
                <div class="empty-chat" style="height: 100%;">
                    <div class="empty-icon">
                        <i class="fas fa-comments"></i>
                    </div>
                    <h4>No conversations yet</h4>
                    <p class="text-muted">Start a conversation with a matched company</p>
                </div>
            `;
        }
        
        function renderConversations() {
            const container = document.getElementById('conversationsList');
            
            if (conversations.length === 0) {
                showEmptyConversations();
                return;
            }
            
            let html = '';
            conversations.forEach(conversation => {
                const otherCompanyId = conversation.participants.find(id => 
                    id !== JSON.parse(localStorage.getItem('symbiosis_user')).companyId);
                
                // Get company name (in production, fetch from companies collection)
                const companyName = conversation.companyName || 'Company ' + otherCompanyId?.substring(0, 6);
                const initials = companyName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                
                // Format time
                const time = conversation.updatedAt ? formatMessageTime(conversation.updatedAt) : '';
                
                // Preview
                const preview = conversation.lastMessage?.text || 'No messages yet';
                
                // Unread count
                const unread = conversation.unreadCount?.[JSON.parse(localStorage.getItem('symbiosis_user')).companyId] || 0;
                
                html += `
                    <div class="conversation-item ${currentConversation?.id === conversation.id ? 'active' : ''}" 
                         data-conversation-id="${conversation.id}">
                        <div class="conversation-avatar">${initials}</div>
                        <div class="conversation-info">
                            <div class="conversation-header">
                                <div class="conversation-name">${companyName}</div>
                                <div class="conversation-time">${time}</div>
                            </div>
                            <div class="conversation-preview">${preview}</div>
                        </div>
                        ${unread > 0 ? `<div class="conversation-badge">${unread}</div>` : ''}
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            // Add click events
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.addEventListener('click', function() {
                    const conversationId = this.dataset.conversationId;
                    openConversation(conversationId);
                });
            });
        }
        
        async function openConversation(conversationId) {
            const user = JSON.parse(localStorage.getItem('symbiosis_user'));
            if (!user || !user.companyId) return;
            
            try {
                // Remove previous listener
                if (messageListener) {
                    messageListener();
                }
                
                // Load conversation data
                const db = firebase.database();
                const snapshot = await db.ref(`conversations/${conversationId}`).once('value');
                
                if (!snapshot.exists()) {
                    alert('Conversation not found');
                    return;
                }
                
                currentConversation = {
                    id: conversationId,
                    ...snapshot.val()
                };
                
                // Mark as read
                await db.ref(`conversations/${conversationId}/unreadCount/${user.companyId}`).set(0);
                
                // Update UI
                showChatArea();
                updateChatHeader();
                loadMessages();
                
                // Listen for new messages
                messageListener = db.ref(`conversations/${conversationId}/messages`)
                    .orderByChild('timestamp')
                    .on('child_added', (snapshot) => {
                        const message = snapshot.val();
                        addMessageToUI(message, snapshot.key);
                    });
                
                // Update conversation list UI
                renderConversations();
                
            } catch (error) {
                console.error('Error opening conversation:', error);
            }
        }
        
        function showChatArea() {
            document.getElementById('emptyChat').style.display = 'none';
            document.getElementById('activeChat').style.display = 'flex';
            document.getElementById('activeChat').style.flexDirection = 'column';
        }
        
        function updateChatHeader() {
            if (!currentConversation) return;
            
            const otherCompanyId = currentConversation.participants.find(id => 
                id !== JSON.parse(localStorage.getItem('symbiosis_user')).companyId);
            
            // In production, fetch company details
            const companyName = currentConversation.companyName || 'Company ' + otherCompanyId?.substring(0, 6);
            const initials = companyName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            
            document.getElementById('chatUserAvatar').textContent = initials;
            document.getElementById('chatUserName').textContent = companyName;
            
            // Check for active deal
            checkActiveDeal(otherCompanyId);
        }
        
        async function checkActiveDeal(otherCompanyId) {
            const user = JSON.parse(localStorage.getItem('symbiosis_user'));
            if (!user || !user.companyId) return;
            
            try {
                const db = firebase.database();
                const snapshot = await db.ref('deals')
                    .orderByChild('participants')
                    .equalTo([user.companyId, otherCompanyId].sort().join('_'))
                    .once('value');
                
                if (snapshot.exists()) {
                    const deals = snapshot.val();
                    const activeDeal = Object.values(deals).find(deal => 
                        deal.status === 'negotiation' || deal.status === 'confirmed');
                    
                    if (activeDeal) {
                        showDealInfo(activeDeal);
                    } else {
                        hideDealInfo();
                    }
                } else {
                    hideDealInfo();
                }
            } catch (error) {
                console.error('Error checking deals:', error);
                hideDealInfo();
            }
        }
        
        function showDealInfo(deal) {
            const container = document.getElementById('dealInfo');
            const details = document.getElementById('dealDetails');
            
            // Update status
            document.getElementById('dealStatus').textContent = deal.status;
            document.getElementById('dealStatus').className = 
                `deal-status status-${deal.status.toLowerCase()}`;
            
            // Update details
            details.innerHTML = `
                <div class="detail-item">
                    <div class="detail-label">Material</div>
                    <div class="detail-value">${deal.material || 'Not specified'}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Quantity</div>
                    <div class="detail-value">${deal.quantity || '0'} tons</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Price</div>
                    <div class="detail-value">₹${deal.price || '0'}</div>
                </div>
                <div class="detail-item">
                    <div class="detail-label">Status</div>
                    <div class="detail-value">${deal.status}</div>
                </div>
            `;
            
            container.style.display = 'block';
        }
        
        function hideDealInfo() {
            document.getElementById('dealInfo').style.display = 'none';
        }
        
        async function loadMessages() {
            if (!currentConversation) return;
            
            try {
                const db = firebase.database();
                const snapshot = await db.ref(`conversations/${currentConversation.id}/messages`)
                    .orderByChild('timestamp')
                    .once('value');
                
                messages = [];
                if (snapshot.exists()) {
                    snapshot.forEach(child => {
                        messages.push({
                            id: child.key,
                            ...child.val()
                        });
                    });
                }
                
                renderMessages();
                
            } catch (error) {
                console.error('Error loading messages:', error);
            }
        }
        
        function renderMessages() {
            const container = document.getElementById('messagesContainer');
            
            if (messages.length === 0) {
                container.innerHTML = `
                    <div class="empty-chat" style="height: auto; padding: 20px;">
                        <p class="text-muted">No messages yet. Start the conversation!</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            let currentDate = '';
            
            messages.forEach(message => {
                const messageDate = new Date(message.timestamp).toLocaleDateString();
                
                // Add date separator if date changed
                if (messageDate !== currentDate) {
                    currentDate = messageDate;
                    html += `
                        <div class="message-date">
                            <span class="date-label">${currentDate}</span>
                        </div>
                    `;
                }
                
                const isOutgoing = message.senderId === JSON.parse(localStorage.getItem('symbiosis_user')).companyId;
                const time = formatMessageTime(message.timestamp);
                const initials = isOutgoing ? 'ME' : 
                    (currentConversation.companyName || 'CO').split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                
                html += `
                    <div class="message ${isOutgoing ? 'outgoing' : 'incoming'}">
                        <div class="message-avatar">${initials}</div>
                        <div class="message-content">
                            <div class="message-bubble">${message.text}</div>
                            <div class="message-time">${time}</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            // Scroll to bottom
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
        }
        
        function addMessageToUI(message, messageId) {
            // Check if message already exists
            if (messages.some(m => m.id === messageId)) return;
            
            const container = document.getElementById('messagesContainer');
            const isOutgoing = message.senderId === JSON.parse(localStorage.getItem('symbiosis_user')).companyId;
            const time = formatMessageTime(message.timestamp);
            const initials = isOutgoing ? 'ME' : 
                (currentConversation.companyName || 'CO').split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
            
            const messageElement = document.createElement('div');
            messageElement.className = `message ${isOutgoing ? 'outgoing' : 'incoming'}`;
            messageElement.innerHTML = `
                <div class="message-avatar">${initials}</div>
                <div class="message-content">
                    <div class="message-bubble">${message.text}</div>
                    <div class="message-time">${time}</div>
                </div>
            `;
            
            container.appendChild(messageElement);
            
            // Scroll to bottom
            setTimeout(() => {
                container.scrollTop = container.scrollHeight;
            }, 100);
            
            // Add to messages array
            messages.push({ id: messageId, ...message });
        }
        
        async function sendMessage() {
            const user = JSON.parse(localStorage.getItem('symbiosis_user'));
            if (!user || !user.companyId || !currentConversation) return;
            
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            
            if (!text) return;
            
            try {
                const db = firebase.database();
                const messageId = db.ref().child('messages').push().key;
                
                const message = {
                    id: messageId,
                    text: text,
                    senderId: user.companyId,
                    timestamp: new Date().toISOString(),
                    type: 'text',
                    status: 'sent'
                };
                
                // Add message to conversation
                await db.ref(`conversations/${currentConversation.id}/messages/${messageId}`).set(message);
                
                // Update conversation last message
                await db.ref(`conversations/${currentConversation.id}`).update({
                    lastMessage: {
                        text: text,
                        senderId: user.companyId,
                        timestamp: new Date().toISOString()
                    },
                    updatedAt: new Date().toISOString()
                });
                
                // Increment unread count for recipient
                const otherCompanyId = currentConversation.participants.find(id => id !== user.companyId);
                if (otherCompanyId) {
                    const unreadRef = db.ref(`conversations/${currentConversation.id}/unreadCount/${otherCompanyId}`);
                    const snapshot = await unreadRef.once('value');
                    const currentUnread = snapshot.val() || 0;
                    await unreadRef.set(currentUnread + 1);
                }
                
                // Clear input
                input.value = '';
                input.style.height = 'auto';
                
                // Update conversation list
                loadConversations();
                
            } catch (error) {
                console.error('Error sending message:', error);
                alert('Failed to send message. Please try again.');
            }
        }
        
        function formatMessageTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diffMs = now - date;
            const diffMins = Math.floor(diffMs / 60000);
            const diffHours = Math.floor(diffMs / 3600000);
            const diffDays = Math.floor(diffMs / 86400000);
            
            if (diffMins < 1) return 'Just now';
            if (diffMins < 60) return `${diffMins}m ago`;
            if (diffHours < 24) return `${diffHours}h ago`;
            if (diffDays < 7) return `${diffDays}d ago`;
            
            return date.toLocaleDateString();
        }
        
        function searchConversations() {
            const searchTerm = document.getElementById('searchConversations').value.toLowerCase();
            
            const filtered = conversations.filter(conv => {
                // In production, search by company name
                return true; // Always show all for demo
            });
            
            renderFilteredConversations(filtered);
        }
        
        function renderFilteredConversations(filteredConversations) {
            const container = document.getElementById('conversationsList');
            
            if (filteredConversations.length === 0) {
                container.innerHTML = `
                    <div class="empty-chat" style="height: 100%;">
                        <p class="text-muted">No conversations found</p>
                    </div>
                `;
                return;
            }
            
            let html = '';
            filteredConversations.forEach(conversation => {
                const companyName = conversation.companyName || 'Company';
                const initials = companyName.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                const time = conversation.updatedAt ? formatMessageTime(conversation.updatedAt) : '';
                
                html += `
                    <div class="conversation-item" data-conversation-id="${conversation.id}">
                        <div class="conversation-avatar">${initials}</div>
                        <div class="conversation-info">
                            <div class="conversation-header">
                                <div class="conversation-name">${companyName}</div>
                                <div class="conversation-time">${time}</div>
                            </div>
                            <div class="conversation-preview">${conversation.lastMessage?.text || ''}</div>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            
            // Add click events
            document.querySelectorAll('.conversation-item').forEach(item => {
                item.addEventListener('click', function() {
                    const conversationId = this.dataset.conversationId;
                    openConversation(conversationId);
                });
            });
        }
        
        function startNewConversation() {
            alert('To start a new conversation, find a company in the Browse or Matches page and click "Contact".');
            window.location.href = 'browse.html';
        }
        
        function viewDealDetails() {
            alert('Deal details would be shown here in production');
        }
    </script>
</body>
