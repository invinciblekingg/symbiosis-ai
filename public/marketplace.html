<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marketplace - Symbiosis.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .marketplace-header {
            background: var(--bg-primary);
            padding: var(--space-6);
            border-bottom: 1px solid var(--border-color-light);
        }

        .marketplace-title {
            font-size: var(--text-2xl);
            font-weight: var(--font-bold);
            margin-bottom: var(--space-4);
            color: var(--neutral-900);
        }

        .filter-bar {
            display: flex;
            gap: var(--space-4);
            flex-wrap: wrap;
            align-items: center;
        }

        .filter-group {
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .filter-group label {
            font-size: var(--text-sm);
            color: var(--neutral-700);
            white-space: nowrap;
            font-weight: var(--font-medium);
        }

        .listings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: var(--space-4);
            padding: var(--space-6);
        }

        .listing-card {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            box-shadow: var(--shadow-sm);
            overflow: hidden;
            transition: all 0.3s;
        }

        .listing-card:hover {
            border-color: rgba(249, 115, 22, 0.45);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6), 0 0 18px rgba(249, 115, 22, 0.18);
            transform: translateY(-4px);
        }

        .listing-image {
            height: 140px;
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.12), rgba(6, 182, 212, 0.08));
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            position: relative;
        }

        .listing-badge {
            position: absolute;
            top: var(--space-3);
            left: var(--space-3);
        }

        .listing-match {
            position: absolute;
            top: var(--space-3);
            right: var(--space-3);
            background: var(--success);
            color: white;
            padding: var(--space-1) var(--space-2);
            border-radius: var(--radius-full);
            font-size: var(--text-xs);
            font-weight: var(--font-bold);
        }

        .listing-body {
            padding: var(--space-4);
        }

        .listing-title {
            font-weight: var(--font-semibold);
            margin-bottom: var(--space-1);
            color: var(--neutral-900);
        }

        .listing-company {
            font-size: var(--text-sm);
            color: var(--neutral-700);
            margin-bottom: var(--space-3);
            display: flex;
            align-items: center;
            gap: var(--space-2);
        }

        .listing-meta {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-2);
            margin-bottom: var(--space-3);
        }

        .listing-meta-item {
            font-size: var(--text-sm);
        }

        .listing-meta-label {
            color: var(--neutral-600);
        }

        .listing-meta-value {
            font-weight: var(--font-medium);
            color: var(--neutral-800);
        }

        .listing-actions {
            display: flex;
            gap: var(--space-2);
        }

        .listing-actions .btn {
            flex: 1;
        }

        .no-results {
            text-align: center;
            padding: var(--space-12);
        }

        .no-results h3 {
            color: var(--neutral-800);
        }

        .no-results p {
            color: var(--neutral-700);
        }

        .loading-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: var(--space-12);
        }

        @media (max-width: 768px) {
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }

            .filter-group {
                flex: 1;
            }

            .filter-group select {
                flex: 1;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar" id="sidebar">
            <div class="sidebar-logo"><a href="/"
                    style="display:flex;align-items:center;gap:var(--space-2);text-decoration:none;">
                    <div style="font-size:28px;">♻️</div><span class="sidebar-logo-text">Symbiosis.ai</span>
                </a></div>
            <div class="sidebar-menu">
                <a href="/dashboard" class="sidebar-menu-item"><span class="icon">🏠</span> Dashboard</a>
                <a href="/marketplace" class="sidebar-menu-item active"><span class="icon">🛒</span> Marketplace</a>
                <a href="/listing" class="sidebar-menu-item"><span class="icon">➕</span> Create Listing</a>
                <a href="/messages" class="sidebar-menu-item"><span class="icon">💬</span> Messages</a>
                <a href="/analytics" class="sidebar-menu-item"><span class="icon">📊</span> Analytics</a>
                <a href="/profile" class="sidebar-menu-item"><span class="icon">👤</span> Profile</a>
            </div>
            <div class="sidebar-menu"
                style="margin-top:auto;padding-top:var(--space-4);border-top:1px solid var(--border-color-light);">
                <a href="#" class="sidebar-menu-item" id="logoutBtn"><span class="icon">🚪</span> Logout</a>
            </div>
        </aside>

        <main class="dashboard-main">
            <header class="dashboard-header">
                <button class="mobile-menu-toggle" id="mobileMenuBtn"><span></span></button>
                <div class="header-search"><span class="search-icon">🔍</span><input type="text" class="form-input"
                        placeholder="Search materials..." id="searchInput"></div>
                <div class="header-actions">
                    <button class="header-icon-btn">🔔</button>
                    <div class="header-user">
                        <div class="avatar" id="userAvatar">U</div>
                    </div>
                </div>
            </header>

            <div class="marketplace-header">
                <h1 class="marketplace-title">🛒 Material Marketplace</h1>
                <div class="filter-bar">
                    <div class="filter-group"><label>Type:</label><select class="form-select form-input-sm"
                            id="filterType">
                            <option value="">All Types</option>
                            <option value="waste">Waste Available</option>
                            <option value="requirement">Materials Needed</option>
                        </select></div>
                    <div class="filter-group"><label>Category:</label><select class="form-select form-input-sm"
                            id="filterCategory">
                            <option value="">All Categories</option>
                            <option value="metal">Metal</option>
                            <option value="plastic">Plastic</option>
                            <option value="construction">Construction</option>
                            <option value="organic">Organic</option>
                            <option value="chemical">Chemical</option>
                            <option value="textile">Textile</option>
                            <option value="paper">Paper</option>
                            <option value="electronic">Electronic</option>
                        </select></div>
                    <div class="filter-group"><label>Sort:</label><select class="form-select form-input-sm" id="sortBy">
                            <option value="newest">Newest First</option>
                            <option value="quantity">Quantity</option>
                        </select></div>
                    <button class="btn btn-primary btn-sm" id="applyFilters">Apply Filters</button>
                    <button class="btn btn-outline btn-sm" id="refreshBtn">🔄 Refresh</button>
                </div>
            </div>

            <div class="listings-grid" id="listingsGrid">
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p style="margin-top: var(--space-4); color: var(--neutral-700);">Loading listings from database...
                    </p>
                </div>
            </div>
        </main>
    </div>

    <div class="mobile-menu-overlay" id="mobileOverlay"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/matching.js"></script>

    <script>
        if (!requireAuth()) throw new Error('Not authenticated');
        const user = getCurrentUser();
        document.getElementById('userAvatar').textContent = (user.companyName || 'U')[0].toUpperCase();

        let allListings = [];

        // Get icon for category
        function getCategoryIcon(category) {
            const icons = { metal: '⚙️', plastic: '♻️', construction: '🏗️', organic: '🌾', chemical: '🧪', textile: '🧵', paper: '📦', electronic: '💻' };
            return icons[category] || '📦';
        }

        function renderListings(listings) {
            const grid = document.getElementById('listingsGrid');

            if (listings.length === 0) {
                grid.innerHTML = `
                    <div class="no-results" style="grid-column: 1 / -1;">
                        <div style="font-size:64px;margin-bottom:var(--space-4);">🔍</div>
                        <h3>No Listings Yet</h3>
                        <p style="margin-bottom: var(--space-4);">Be the first to list your materials!</p>
                        <a href="/listing" class="btn btn-primary">➕ Create Listing</a>
                    </div>
                `;
                return;
            }

            grid.innerHTML = listings.map(l => `
                <div class="listing-card">
                    <div class="listing-image">${getCategoryIcon(l.category)}
                        <span class="listing-badge badge ${l.type === 'waste' ? 'badge-success' : 'badge-primary'}">${l.type === 'waste' ? '🏭 Available' : '📋 Needed'}</span>
                    </div>
                    <div class="listing-body">
                        <h3 class="listing-title">${l.title || 'Untitled Material'}</h3>
                        <div class="listing-company">${l.verified ? '✅' : '🏢'} ${l.company || 'Anonymous'} • ${l.location || 'Unknown'}</div>
                        <div class="listing-meta">
                            <div class="listing-meta-item"><div class="listing-meta-label">Quantity</div><div class="listing-meta-value">${l.quantity || '-'} ${l.unit || 'tons'}</div></div>
                            <div class="listing-meta-item"><div class="listing-meta-label">Category</div><div class="listing-meta-value">${l.category || 'Other'}</div></div>
                        </div>
                        <div class="listing-actions">
                            <button class="btn btn-outline btn-sm">View Details</button>
                            <button class="btn btn-primary btn-sm" onclick="contactCompany('${l.companyId}')">Contact</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function loadListings() {
            const grid = document.getElementById('listingsGrid');
            grid.innerHTML = '<div class="loading-state" style="grid-column:1/-1;"><div class="spinner"></div><p style="margin-top:var(--space-4);color:var(--neutral-700);">Loading...</p></div>';

            try {
                allListings = await MatchingEngine.getAllListings();
                renderListings(allListings);
            } catch (error) {
                console.error('Error loading listings:', error);
                grid.innerHTML = '<div class="no-results" style="grid-column:1/-1;"><div style="font-size:64px">⚠️</div><h3>Error Loading</h3><p>Please try refreshing the page</p></div>';
            }
        }

        function applyFilters() {
            const type = document.getElementById('filterType').value;
            const category = document.getElementById('filterCategory').value;
            const sortBy = document.getElementById('sortBy').value;

            let filtered = [...allListings];
            if (type) filtered = filtered.filter(l => l.type === type);
            if (category) filtered = filtered.filter(l => l.category === category);

            if (sortBy === 'newest') {
                filtered.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
            } else if (sortBy === 'quantity') {
                filtered.sort((a, b) => (parseFloat(b.quantity) || 0) - (parseFloat(a.quantity) || 0));
            }

            renderListings(filtered);
        }

        function contactCompany(companyId) {
            sessionStorage.setItem('startConversationWith', companyId);
            window.location.href = '/messages';
        }

        // Initialize
        loadListings();

        // Event listeners
        document.getElementById('applyFilters').addEventListener('click', applyFilters);
        document.getElementById('refreshBtn').addEventListener('click', loadListings);

        document.getElementById('searchInput').addEventListener('input', function () {
            const query = this.value.toLowerCase();
            const filtered = allListings.filter(l =>
                (l.title || '').toLowerCase().includes(query) ||
                (l.company || '').toLowerCase().includes(query) ||
                (l.category || '').toLowerCase().includes(query)
            );
            renderListings(filtered);
        });

        document.getElementById('mobileMenuBtn').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('mobileOverlay').classList.toggle('active'); });
        document.getElementById('mobileOverlay').addEventListener('click', () => { document.getElementById('sidebar').classList.remove('active'); document.getElementById('mobileOverlay').classList.remove('active'); });
        document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); logout(); });
    </script>
</body>

</html>
