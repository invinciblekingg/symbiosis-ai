<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Symbiosis.ai</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/responsive.css">
    <style>
        .messages-layout {
            display: grid;
            grid-template-columns: 320px 1fr;
            height: calc(100vh - 70px);
        }

        .conversations-list {
            background: var(--bg-primary);
            border-right: 1px solid var(--border-color-light);
            overflow-y: auto;
        }

        .conversations-header {
            padding: var(--space-4);
            border-bottom: 1px solid var(--border-color-light);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .conversations-header h3 {
            font-size: var(--text-lg);
            margin: 0;
        }

        .conversation-item {
            display: flex;
            gap: var(--space-3);
            padding: var(--space-4);
            border-bottom: 1px solid var(--border-color-light);
            cursor: pointer;
            transition: background 0.2s;
        }

        .conversation-item:hover {
            background: rgba(255, 255, 255, 0.04);
        }

        .conversation-item.active {
            background: rgba(249, 115, 22, 0.12);
            border-left: 3px solid var(--primary-500);
        }

        .conversation-avatar {
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: var(--primary-100);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: var(--font-semibold);
            color: var(--primary-600);
            flex-shrink: 0;
        }

        .conversation-info {
            flex: 1;
            min-width: 0;
        }

        .conversation-name {
            font-weight: var(--font-semibold);
            margin-bottom: var(--space-1);
            display: flex;
            justify-content: space-between;
        }

        .conversation-time {
            font-size: var(--text-xs);
            color: var(--neutral-500);
        }

        .conversation-preview {
            font-size: var(--text-sm);
            color: var(--neutral-600);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .conversation-badge {
            background: var(--primary-500);
            color: white;
            font-size: var(--text-xs);
            padding: 2px 6px;
            border-radius: var(--radius-full);
        }

        .chat-area {
            display: flex;
            flex-direction: column;
            background: var(--bg-secondary);
        }

        .chat-header {
            display: flex;
            align-items: center;
            gap: var(--space-3);
            padding: var(--space-4);
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color-light);
        }

        .chat-header-info {
            flex: 1;
        }

        .chat-header-name {
            font-weight: var(--font-semibold);
        }

        .chat-header-status {
            font-size: var(--text-sm);
            color: var(--neutral-500);
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-4);
            display: flex;
            flex-direction: column;
            gap: var(--space-3);
        }

        .message {
            display: flex;
            gap: var(--space-2);
            max-width: 70%;
        }

        .message.sent {
            align-self: flex-end;
            flex-direction: row-reverse;
        }

        .message-avatar {
            width: 32px;
            height: 32px;
            border-radius: var(--radius-full);
            background: var(--neutral-200);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: var(--text-sm);
            flex-shrink: 0;
        }

        .message-content {
            padding: var(--space-3) var(--space-4);
            border-radius: var(--radius-lg);
            font-size: var(--text-sm);
        }

        .message:not(.sent) .message-content {
            background: #161e2c;
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #ffffff;
            border-bottom-left-radius: var(--radius-sm);
        }

        .message.sent .message-content {
            background: linear-gradient(135deg, #f97316 0%, #ea580c 100%);
            color: #ffffff;
            border-bottom-right-radius: var(--radius-sm);
            box-shadow: 0 2px 8px rgba(249, 115, 22, 0.3);
        }

        .message-time {
            font-size: var(--text-xs);
            color: var(--neutral-500);
            margin-top: var(--space-1);
        }

        .message.sent .message-time {
            text-align: right;
        }

        .chat-input-area {
            padding: var(--space-4);
            background: var(--bg-primary);
            border-top: 1px solid var(--border-color-light);
            display: flex;
            gap: var(--space-3);
        }

        .chat-input-area input {
            flex: 1;
        }

        .chat-input-area button {
            padding: var(--space-3) var(--space-5);
        }

        .empty-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--neutral-500);
        }

        .empty-chat-icon {
            font-size: 64px;
            margin-bottom: var(--space-4);
            opacity: 0.5;
        }

        @media (max-width: 768px) {
            .messages-layout {
                grid-template-columns: 1fr;
            }

            .conversations-list {
                display: none;
            }

            .conversations-list.mobile-show {
                display: block;
                position: fixed;
                inset: 0;
                z-index: 1000;
            }
        }
    </style>
</head>

<body>
    <div class="dashboard-layout">
        <aside class="dashboard-sidebar" id="sidebar">
            <div class="sidebar-logo"><a href="/"
                    style="display:flex;align-items:center;gap:var(--space-2);text-decoration:none;">
                    <div style="font-size:28px;">♻️</div><span class="sidebar-logo-text">Symbiosis.ai</span>
                </a></div>
            <div class="sidebar-menu">
                <a href="/dashboard" class="sidebar-menu-item"><span class="icon">🏠</span> Dashboard</a>
                <a href="/marketplace" class="sidebar-menu-item"><span class="icon">🛒</span> Marketplace</a>
                <a href="/listing" class="sidebar-menu-item"><span class="icon">➕</span> Create Listing</a>
                <a href="/messages" class="sidebar-menu-item active"><span class="icon">💬</span> Messages</a>
                <a href="/analytics" class="sidebar-menu-item"><span class="icon">📊</span> Analytics</a>
                <a href="/profile" class="sidebar-menu-item"><span class="icon">👤</span> Profile</a>
            </div>
            <div class="sidebar-menu"
                style="margin-top:auto;padding-top:var(--space-4);border-top:1px solid var(--border-color-light);">
                <a href="#" class="sidebar-menu-item" id="logoutBtn"><span class="icon">🚪</span> Logout</a>
            </div>
        </aside>

        <main class="dashboard-main" style="padding:0;">
            <header class="dashboard-header">
                <button class="mobile-menu-toggle" id="mobileMenuBtn"><span></span></button>
                <h2 style="font-size:var(--text-xl);font-weight:var(--font-semibold);">💬 Messages</h2>
                <div class="header-actions">
                    <div class="header-user">
                        <div class="avatar" id="userAvatar">U</div>
                    </div>
                </div>
            </header>

            <div class="messages-layout">
                <div class="conversations-list" id="conversationsList">
                    <div class="conversations-header">
                        <h3>Conversations</h3><input type="text" class="form-input form-input-sm"
                            placeholder="Search..." style="width:120px;">
                    </div>
                    <div id="conversationsContainer"></div>
                </div>

                <div class="chat-area" id="chatArea">
                    <div class="empty-chat" id="emptyChat">
                        <div class="empty-chat-icon">💬</div>
                        <h3>Select a conversation</h3>
                        <p>Choose from your existing conversations or start a new one</p>
                    </div>
                    <div class="chat-header" id="chatHeader" style="display:none;">
                        <div class="conversation-avatar" id="chatAvatar">T</div>
                        <div class="chat-header-info">
                            <div class="chat-header-name" id="chatName">Company</div>
                            <div class="chat-header-status" id="chatStatus">Online</div>
                        </div>
                        <button class="btn btn-outline btn-sm">📞 Call</button>
                        <button class="btn btn-outline btn-sm">📋 View Profile</button>
                    </div>
                    <div class="chat-messages" id="chatMessages" style="display:none;"></div>
                    <div class="chat-input-area" id="chatInputArea" style="display:none;">
                        <input type="text" class="form-input" id="messageInput" placeholder="Type a message...">
                        <button class="btn btn-primary" id="sendBtn">Send ➤</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <div class="mobile-menu-overlay" id="mobileOverlay"></div>
    <div class="toast-container" id="toastContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/auth.js"></script>

    <script>
        if (!requireAuth()) throw new Error('Not authenticated');
        const user = getCurrentUser();
        document.getElementById('userAvatar').textContent = (user.companyName || 'U')[0].toUpperCase();

        const mockConversations = [
            { id: 1, name: 'TechSteel Industries', avatar: 'T', lastMessage: 'Yes, we can arrange pickup next week', time: '10:30 AM', unread: 2, material: 'Fly Ash' },
            { id: 2, name: 'GreenChem Pvt Ltd', avatar: 'G', lastMessage: 'What quantity can you deliver monthly?', time: 'Yesterday', unread: 0, material: 'Chemical Sludge' },
            { id: 3, name: 'EcoPaper Mills', avatar: 'E', lastMessage: 'The quality report looks good. Let\'s proceed.', time: '2 days ago', unread: 0, material: 'Rice Husk' },
        ];

        const mockMessages = {
            1: [
                { id: 1, sender: 'them', text: 'Hi, I saw your Fly Ash listing. Very interested!', time: '9:00 AM' },
                { id: 2, sender: 'me', text: 'Hello! Thanks for reaching out. What quantity are you looking for?', time: '9:15 AM' },
                { id: 3, sender: 'them', text: 'We need approximately 50 tons per month. Can you handle that?', time: '9:30 AM' },
                { id: 4, sender: 'me', text: 'Absolutely! We produce about 100 tons monthly. 50 tons is manageable.', time: '9:45 AM' },
                { id: 5, sender: 'them', text: 'Great! Can you share the quality certificate?', time: '10:00 AM' },
                { id: 6, sender: 'me', text: 'Sure, I\'ll send it over. Also, we can arrange a site visit if needed.', time: '10:15 AM' },
                { id: 7, sender: 'them', text: 'Yes, we can arrange pickup next week', time: '10:30 AM' },
            ],
            2: [
                { id: 1, sender: 'them', text: 'Hello, interested in your chemical sludge listing.', time: 'Yesterday' },
                { id: 2, sender: 'me', text: 'Hi! Yes, we have regular output. What\'s your requirement?', time: 'Yesterday' },
                { id: 3, sender: 'them', text: 'What quantity can you deliver monthly?', time: 'Yesterday' },
            ],
            3: [
                { id: 1, sender: 'them', text: 'Can you send the quality test report?', time: '2 days ago' },
                { id: 2, sender: 'me', text: 'Here is the report. Let me know if you need more details.', time: '2 days ago' },
                { id: 3, sender: 'them', text: 'The quality report looks good. Let\'s proceed.', time: '2 days ago' },
            ]
        };

        let activeConversation = null;

        function renderConversations() {
            document.getElementById('conversationsContainer').innerHTML = mockConversations.map(c => `
                <div class="conversation-item ${activeConversation === c.id ? 'active' : ''}" data-id="${c.id}">
                    <div class="conversation-avatar">${c.avatar}</div>
                    <div class="conversation-info">
                        <div class="conversation-name">${c.name} <span class="conversation-time">${c.time}</span></div>
                        <div class="conversation-preview">${c.lastMessage}</div>
                    </div>
                    ${c.unread > 0 ? `<span class="conversation-badge">${c.unread}</span>` : ''}
                </div>
            `).join('');

            document.querySelectorAll('.conversation-item').forEach(item => {
                item.addEventListener('click', () => openConversation(parseInt(item.dataset.id)));
            });
        }

        function openConversation(id) {
            activeConversation = id;
            const conv = mockConversations.find(c => c.id === id);

            document.getElementById('emptyChat').style.display = 'none';
            document.getElementById('chatHeader').style.display = 'flex';
            document.getElementById('chatMessages').style.display = 'flex';
            document.getElementById('chatInputArea').style.display = 'flex';

            document.getElementById('chatAvatar').textContent = conv.avatar;
            document.getElementById('chatName').textContent = conv.name;
            document.getElementById('chatStatus').textContent = `Discussing: ${conv.material}`;

            const messages = mockMessages[id] || [];
            document.getElementById('chatMessages').innerHTML = messages.map(m => `
                <div class="message ${m.sender === 'me' ? 'sent' : ''}">
                    <div class="message-avatar">${m.sender === 'me' ? '👤' : conv.avatar}</div>
                    <div>
                        <div class="message-content">${m.text}</div>
                        <div class="message-time">${m.time}</div>
                    </div>
                </div>
            `).join('');

            document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;
            renderConversations();
        }

        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text || !activeConversation) return;

            const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            mockMessages[activeConversation].push({ id: Date.now(), sender: 'me', text, time: now });

            const conv = mockConversations.find(c => c.id === activeConversation);
            conv.lastMessage = text;
            conv.time = now;

            openConversation(activeConversation);
            input.value = '';
        }

        document.getElementById('sendBtn').addEventListener('click', sendMessage);
        document.getElementById('messageInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') sendMessage(); });

        renderConversations();

        document.getElementById('mobileMenuBtn').addEventListener('click', () => { document.getElementById('sidebar').classList.toggle('active'); document.getElementById('mobileOverlay').classList.toggle('active'); });
        document.getElementById('mobileOverlay').addEventListener('click', () => { document.getElementById('sidebar').classList.remove('active'); document.getElementById('mobileOverlay').classList.remove('active'); });
        document.getElementById('logoutBtn').addEventListener('click', (e) => { e.preventDefault(); logout(); });
    </script>
</body>

</html>
